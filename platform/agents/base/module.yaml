id: base
type: agent
version: 1.0.0
stability: stable
summary: Cross-agent operating pack for trust tiers, stop conditions, and audit expectations.
tier:
  declared: 2
maxTier: 5
maxTierRationale: >-
  Foundational cross-agent pack inherited by every consumer; the ceiling is left
  at the maximum so it never caps a consumer's own higher-tier workload or
  composition. Actual reach stays bounded by each dispatch's tier_ceiling and the
  human-authorization gates at tiers 4–5 — the ceiling caps, it never grants.
dependsOn:
  - kernel/base
conflictsWith: []
requiredArtifacts:
  - AGENTS.md
optionalArtifacts: []
sensitivePaths: []
companionRules: []
validators:
  - validate-agent-pack
reviewGates:
  - Agent packs define boundaries; humans still approve tier escalation and sensitive changes.
agentAdapters:
  - AGENTS.md
compiledFragments:
  - platform/agents/base/README.md
