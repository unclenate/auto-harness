# Starter composition for governed live multi-agent coordination. Activates the
# agent-coordination overlay alongside its static sibling, the work-package lane,
# on a node-typescript substrate — the shape a dispatcher uses when running
# several agents in isolated worktrees (work-package governs each agent's STATIC
# lane) that must also coordinate LIVE (agent-coordination governs the control
# loop between sessions: dispatch/ack/progress/done/block/sync/verdict, with a
# tier_ceiling that caps but never grants). Half-enforced reference-tool genre:
# the two contracts under docs/coordination/ + the reference orchestrator under
# reference/agent-coordination/ are the deliverables, not an enforced runtime.
# References:
#   - platform/profiles/management/agent-coordination/README.md
#   - docs/coordination/control-loop-contract.md
#   - docs/coordination/adapter-contract.md
#   - reference/agent-coordination/README.md
#   - docs/requirements/PRD-0039-agent-coordination-control-loop.md
schemaVersion: 1
project:
  id: example-agent-coordination-bus
  name: Example Live Multi-Agent Coordination
  maturity: prototype
  criticality: medium
modules:
  core:
    - kernel/base
  stacks:
    - node-typescript
  management:
    - work-package
    - agent-coordination
overrides:
  requiredArtifacts: []
  disabledValidations: []
