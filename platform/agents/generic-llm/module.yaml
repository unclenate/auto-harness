id: generic-llm
type: agent
version: 1.0.0
stability: stable
summary: Generic LLM agent pack for non-Claude tools that still need kernel-aligned trust and escalation rules.
tier:
  declared: 2
maxTier: 5
maxTierRationale: >-
  General-purpose pack for non-Claude LLM tools whose real capabilities vary; the
  ceiling is left at the maximum rather than under-declaring for an unknown client,
  so it never becomes the binding limit on a legitimately-composed higher-tier
  workload. Reach is still gated per-dispatch by tier_ceiling and by the human
  gates at 4–5 (caps, never grants) — consistent with this pack's reviewGate that
  it must not claim permissions above what the kernel permits.
dependsOn:
  - kernel/base
  - base
conflictsWith: []
requiredArtifacts: []
optionalArtifacts: []
sensitivePaths: []
companionRules: []
validators:
  - validate-agent-pack
reviewGates:
  - Generic packs must not claim permissions higher than the kernel permits.
agentAdapters:
  - AGENTS.md
compiledFragments:
  - platform/agents/generic-llm/README.md
